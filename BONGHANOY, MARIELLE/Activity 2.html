<!DOCTYPE html>
<html>
<head>
    <title>Activity 2 - CSS Basic Buttons</title>
    <style>
        body {
            background-color: #1a3d1a;
            font-family: Arial, sans-serif;
            padding: 40px;
            color: white;
        }
        
        h1 {
            color: #7CFC00;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .uberbutton {
            background-color: #000;
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            cursor: pointer;
        }
        
        .amazonbutton {
            background-color: rgb(255,216,20);
            border: none;
            color: #000;
            padding: 15px 32px;
            font-size: 16px;
            width: 200px;
            border-radius: 49px;
            cursor: pointer;
        }
        
        .githubbutton {
            background-color: rgb(46,164,79);
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .bootstrapbutton {
            background-color: rgb(121,82,179);
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .bootstrap2button {
            background-color: white;
            border: 1px solid rgb(108,117,125);
            color: rgb(108,117,125);
            padding: 15px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .linkedinbutton {
            background-color: rgb(10,102,194);
            border: none;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 49px;
            cursor: pointer;
        }
        
        .linkedin2button {
            background-color: white;
            border: 1px solid rgb(10,102,194);
            color: rgb(10,102,194);
            padding: 15px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 49px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Activity 2 - CSS Basic Buttons</h1>
    <div class="btn-grid">
        <button class="uberbutton">Request now</button>
        <button class="amazonbutton">Add to cart</button>
        <button class="githubbutton">Sign up</button>
        <button class="bootstrapbutton">Get started</button>
        <button class="bootstrap2button">Download</button>
        <button class="linkedinbutton">Apply on company website</button>
        <button class="linkedin2button">Save</button>
    </div>
</body>
</html>
