<!DOCTYPE html>
<html>
<head>
    <title>Activity 6 - Login Gate</title>
    <link rel="icon" href="pvz.jpeg" type="image/jpeg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            color: white;
        }
        
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: url('pvz.jpeg') no-repeat center center / cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #login-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(26, 61, 26, 0.85);
        }
        
        .login-box {
            position: relative;
            background: rgba(255,255,255,0.1);
            border: 2px solid #7CFC00;
            border-radius: 16px;
            padding: 40px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 30px #7CFC0033;
        }
        
        .login-box h1 {
            font-size: 24px;
            margin-bottom: 6px;
            color: #7CFC00;
            text-shadow: 0 0 10px #7CFC00;
        }
        
        .login-box p {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 24px;
        }
        
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 2px solid #7CFC0044;
            background: rgba(255,255,255,0.07);
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        
        .login-box input:focus {
            border-color: #7CFC00;
        }
        
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #7CFC00;
            color: #225533;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
        }
        
        .login-box button:hover {
            background: #6ad900;
            box-shadow: 0 0 16px #7CFC0088;
        }
        
        .login-box .link {
            margin-top: 16px;
            font-size: 13px;
            color: #ccc;
        }
        
        .login-box .link a {
            color: #7CFC00;
            text-decoration: none;
        }
        
        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
        
        #main-content {
            display: none;
            padding: 40px;
            background: #1a3d1a;
            min-height: 100vh;
        }
        
        #main-content h1 {
            color: #7CFC00;
        }
    </style>
</head>
<body>

    <!-- LOGIN GATE -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Welcome Back 🌻</h1>
            <p>Sign in to your garden</p>
            <div class="error-msg" id="error-msg">Please fill in all fields.</div>
            <input type="text" id="username" placeholder="Username or Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="doLogin()">Login</button>
            <div class="link">Don't have an account? <a href="#">Sign up</a></div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <h1>Welcome to Your Garden! 🌻</h1>
        <p>You have successfully logged in.</p>
    </div>

    <script>
        function doLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (!u || !p) {
                document.getElementById('error-msg').style.display = 'block';
                return;
            }
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    </script>

</body>
</html>
